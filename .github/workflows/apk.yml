# Gera o APK do PokerTramaS na nuvem do GitHub (grátis). Veja o README.
name: Gerar APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Instalar dependências
        run: npm install
      - name: Testar regras do jogo
        run: npm test
      - name: Criar projeto Android
        run: |
          npx cap add android
          npm run icons
          npx cap sync android
      - name: Usar sempre a mesma assinatura (para atualizar sem desinstalar)
        run: mkdir -p ~/.android && cp android-debug.keystore ~/.android/debug.keystore
      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Conferir APK (assinatura e versão mínima do Android)
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          SIG=$("$BT/apksigner" verify --verbose --print-certs "$APK" 2>&1 | grep -E "Verifies|Verified using|certificate SHA-256|WARNING|ERROR" | tr '\n' ' ')
          BADGE=$("$BT/aapt" dump badging "$APK" | grep -E "^package:|sdkVersion|targetSdkVersion" | tr '\n' ' ')
          echo "::notice title=assinatura::$SIG"
          echo "::notice title=pacote::$BADGE"
      - uses: actions/upload-artifact@v4
        with:
          name: PokerTrama-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
