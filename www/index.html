/* Fichas por valor (cores de cassino) */
const DENOMS = [
  [100000, '#1565C0', '#FFFFFF', '#5E9BE0'], [25000, '#00897B', '#FFFFFF', '#4DB6AC'], [5000, '#D84315', '#FFFFFF', '#FF8A65'],
  [1000, '#F9A825', '#3E2723', '#FFE082'], [500, '#6A1B9A', '#FFFFFF', '#AB47BC'], [100, '#212121', '#FFFFFF', '#5A5A5A'],
  [25, '#2E7D32', '#FFFFFF', '#66BB6A'], [5, '#C62828', '#FFFFFF', '#EF5350'], [1, '#ECEFF1', '#1565C0', '#FFFFFF'],
];
function chipColors(amount, max) {
  const out = []; let left = Math.max(0, Math.round(amount));
  for (const [v, c, s, h] of DENOMS) {
    while (left >= v && out.length < max) { out.push([c, s, h]); left -= v; }
  }
  if (!out.length && amount > 0) out.push(DENOMS[DENOMS.length - 1].slice(1));
  return out;
}
function chipStack(amount, max = 6) {
  const cs = chipColors(amount, max);
  return `<div class="stackc" style="height:${22 + (cs.length - 1) * 3}px">${cs.map(([c, s, h], k) =>
    `<div class="chip" style="--c:${c};--s:${s};--h:${h};bottom:${k * 3}px"></div>`).join('')}</div>`;
}
function chipPile(amount) {
  // pote: até 3 colunas
  const cs = chipColors(amount, 18);
  const cols = [[], [], []];
  cs.forEach((x, i) => cols[i % 3].push(x));
  return `<div class="chips">${cols.filter((c) => c.length).map((col) => `<div class="stackc" style="height:${22 + (col.length - 1) * 3}px">${col.map(([c, s, h], k) =>
    `<div class="chip" style="--c:${c};--s:${s};--h:${h};bottom:${k * 3}px"></div>`).join('')}</div>`).join('')}</div>`;
}

const curBB = () => (state && state.blinds ? state.blinds.bb : 1);
function amt(n, withUnit = true) {
  if (!unitBB || !state) return fmt(n);
  const v = Math.round((n / curBB()) * 10) / 10;
  return v.toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + (withUnit ? ' BB' : '');
}
function setUnit(bb) {
  unitBB = bb; lsSet('pt.unit', bb ? 'bb' : 'chips');
  $('unitBtn').setAttribute('aria-pressed', bb);
  render();
}
$('unitBtn').onclick = () => setUnit(!unitBB);
setUnit(unitBB);

function seatPos(j, n, wrap) {
  const ang = (90 + j * 360 / n) * Math.PI / 180;
  const rx = 50 - (wrap.clientWidth < 500 ? 12 : 11);
  const ry = 50 - (wrap.clientHeight < 500 ? 11 : 9);
  // você (embaixo) sobe um pouco: suas cartas grandes ficam em cima da placa
  const lift = j === 0 ? Math.min(7, 9000 / Math.max(300, wrap.clientHeight) * 0.6) : 0;
  return { x: 50 + rx * Math.cos(ang), y: 50 + ry * Math.sin(ang) - lift };
}

const active = () => state && E.handActive(state);
const mySeatIdx = () => (state ? E.seatOf(state, myId) : -1);
const potTotal = () => state.seats.reduce((t, s) => t + (s && active() ? s.committed : 0), 0);
const potCollected = () => state.seats.reduce((t, s) => t + (s && active() ? s.committed - s.bet : 0), 0);
function legal(i) {
  const L = E.legalActions(state, i);
  return L && { canCheck: L.canCheck, toCall: L.toCall, canRaise: L.canRaise, minTo: L.minRaiseTo, maxTo: L.maxRaiseTo };
}
const BADGE = { 'Passou': 'b-check', 'Pagou': 'b-call', 'Apostou': 'b-raise', 'Aumentou': 'b-raise', 'All-in': 'b-allin', 'Desistiu': 'b-fold' };

let geo = { seats: {}, center: { x: 0, y: 0 }, pot: { x: 0, y: 0 } };

function render() {
  if (!state || $('game').hidden) return;
  const wrap = $('tableWrap');
  const W = wrap.clientWidth, H = wrap.clientHeight;
  const my = mySeatIdx();
  const base = my >= 0 ? my : 0;
  const showdown = state.phase === 'showdown';
  const winSet = new Set((state.results || []).flatMap((r) => r.cards || []));
  const winners = new Set((state.results || []).filter((r) => !r.returned).flatMap((r) => r.winners.map((w) => w.seat)));
  const online = (s) => mode === 'client' || s.uid === myId || Host.conns.has(s.uid);
  const changedBets = prevSnap && prevSnap.hand === state.handNumber ? prevSnap.bets : null;

  renderBlindsLine();

  let html = '';
  const order = state.seats.map((s, i) => (s ? i : -1)).filter((i) => i >= 0)
    .sort((a, b) => ((a - base + 9) % 9) - ((b - base + 9) % 9));
  const g = { seats: {}, center: { x: W / 2, y: H * 0.5 } };
  state.seats.forEach((s, i) => {
    if (!s) return;
    const { x, y } = seatPos(order.indexOf(i), order.length, wrap);
    const isMe = i === my;
    const { bx, by } = betPos(x, y, isMe);
    const dx = x + (x <= 50 ? 1 : -1) * (isMeSeat(i, my) ? 20 : 17), dy = y + (y > 50 ? -1 : 3);
    g.seats[i] = { x: x * W / 100, y: y * H / 100, bx: bx * W / 100, by: by * H / 100 };
    const turn = state.toAct === i && active();
    const out = (!s.inHand && state.phase !== 'waiting') || s.folded || (s.sitOut && !s.inHand) || s.eliminated || s.waitingReentry;
    const cards = s.shown && !isMe ? `<div class="shown">${s.shown.map((c) => cardHTML(c, winSet.has(c) ? 'win' : '')).join('')}</div>` : '';
    const holes = !isMe && !s.shown && s.inHand && !s.folded && active() ? `<div class="holes">${cardHTML(null)}${cardHTML(null)}</div>` : '';
    let tag = s.lastAction || '', cls = BADGE[tag] || (tag === 'SB' || tag === 'BB' ? '' : 'b-hand');
    if (s.eliminated) { tag = `${s.place}º lugar`; cls = 'b-off'; }
    else if (s.waitingReentry) { tag = 'Quebrou'; cls = 'b-off'; }
    else if (s.sitOut || !online(s)) { tag = 'Offline'; cls = 'b-off'; }
    else if (s.stack === 0 && !s.inHand) { tag = 'Sem fichas'; cls = 'b-off'; }
    else if (!s.inHand && state.phase !== 'waiting' && !s.folded) { tag = 'Próxima mão'; cls = 'b-off'; }
    if (winners.has(i) && showdown) { tag = 'Venceu'; cls = 'b-win'; }
    const bank = turn && state.usingBank;
    const heroCards = isMe && myCardsNow();
    let heroHTML = '';
    if (heroCards) {
      const reveal = lastRevealHand !== state.handNumber;
      if (reveal) lastRevealHand = state.handNumber;
      const n = state.seats.filter((x) => x && x.inHand).length;
      heroHTML = `<div class="hero-cards ${reveal ? 'reveal' : ''}">${heroCards.map((c, k) =>
        cardHTML(c, `${s.folded ? 'dim' : ''} ${winSet.has(c) ? 'win' : ''}`, reveal ? `animation-delay:${0.3 + (k + 1) * n * 0.09}s` : '')).join('')}</div>`;
      const hl = handLabelTxt();
      if (hl && !showdown && !s.folded && (!tag || tag === 'SB' || tag === 'BB')) { tag = hl; cls = 'b-hand'; }
    }
    html += `<div class="seat ${heroCards ? 'hero' : ''} ${turn ? 'turn' : ''} ${bank ? 'bank' : ''} ${out ? 'out' : ''} ${winners.has(i) && showdown ? 'win' : ''}" data-seat="${i}" style="left:${x}%;top:${y}%">
      ${holes}${heroHTML}
      ${avaHTML(s.name, s.color, avatars[s.uid])}
      <div class="plate"><span class="nm">${esc(s.name)}${s.rebuys ? `<i class="re" title="${s.rebuys} reentrada(s)">↻${s.rebuys}</i>` : ''}</span><span class="stk">${amt(s.stack)}</span>
        ${isMe && state.settings.timeBankSeconds > 0 && !s.eliminated ? `<span class="bk">⏳ <span id="myBank">${Math.ceil(myBankLeft(s, i) / 1000)}</span> s de banco</span>` : ''}
        ${turn ? '<div class="tbar"><i></i></div>' : ''}</div>
      ${bank ? '<div class="bankt">Banco de tempo</div>' : ''}
      ${tag ? `<div class="badge ${cls}">${esc(tag)}</div>` : ''}
      ${cards}
    </div>`;
    if (state.dealer === i && state.handNumber > 0 && !s.eliminated) html += `<div class="dealer" style="left:${dx}%;top:${dy}%">D</div>`;
    if (s.bet > 0) {
      const isNew = changedBets && s.bet > (changedBets[i] || 0);
      html += `<div class="bet ${isNew ? 'in' : ''}" style="left:${bx}%;top:${by}%">${chipStack(s.bet, 5)}<span class="pill">${amt(s.bet)}</span></div>`;
    }
  });
  $('seats').innerHTML = html;
  $('seats').classList.toggle('many', order.length > 6);

  const prevBoard = prevSnap && prevSnap.hand === state.handNumber ? prevSnap.board : 0;
  let board = '';
  for (let i = 0; i < 5; i++) {
    const c = state.board[i];
    const delay = i >= prevBoard ? `animation-delay:${(i - prevBoard) * 0.15 + 0.25}s` : '';
    board += c ? cardHTML(c, `${winSet.size && !winSet.has(c) ? 'dim' : ''} ${winSet.has(c) ? 'win' : ''} ${i >= prevBoard ? 'deal' : ''}`, delay) : '<div class="slot"></div>';
  }
  $('board').innerHTML = board;

  const collected = potCollected();
  $('pot').innerHTML = active() && potTotal() > 0
    ? `${collected > 0 ? chipPile(collected) : ''}<div class="pot-pill"><small>Pote total</small><b>${amt(potTotal())}</b></div>` : '';
  const pr = $('pot').getBoundingClientRect(), wr = wrap.getBoundingClientRect();
  g.pot = pr.width ? { x: pr.left - wr.left + pr.width / 2, y: pr.top - wr.top + pr.height / 2 } : { x: W / 2, y: H * 0.42 };
  geo = g;

  let msg = '';
  const isHost = mode === 'host';
  const seated = state.seats.filter(Boolean).length;
  const T = state.tourney;
  if (state.phase === 'waiting') {
    if (!state.started) msg = isHost
      ? (seated < 2 ? 'Passe o ID e a senha para os amigos. Precisa de pelo menos 2 na mesa.' : `${seated} na mesa. Comece quando todos chegarem.`)
      : `${seated} na mesa. Esperando o anfitrião começar.`;
    else {
      const w = state.seats.filter((x) => x && x.waitingReentry);
      msg = w.length ? `Esperando ${w.map((x) => esc(x.name)).join(' e ')} decidir a reentrada…` : 'Esperando jogadores com fichas para continuar.';
    }
    if (!state.started && E.isTourney(state)) msg += `<div class="note">Torneio: ${fmt(state.settings.startingStack)} fichas, blinds ${fmt(state.blinds.sb)}/${fmt(state.blinds.bb)} (ante ${fmt(state.blinds.ante)}), ${state.settings.levelMinutes} min por nível${state.settings.reentryLevels ? `, reentrada até o nível ${state.settings.reentryLevels}` : ', sem reentrada'}.</div>`;
  } else if (showdown && state.results) {
    const merged = [];
    for (const r of state.results) {
      const key = (r.returned ? 'ret:' : '') + r.winners.map((w) => w.seat).join(',');
      const last = merged[merged.length - 1];
      if (last && last.key === key) { last.amount += r.amount; last.handName = last.handName || r.handName; }
      else merged.push({ ...r, key });
    }
    const contested = merged.filter((r) => !r.returned).length;
    msg = merged.map((r) => {
      if (r.returned) return `<div class="note">${amt(r.amount)} voltaram para ${esc(r.winners[0].name)}</div>`;
      const who = r.winners.map((w) => esc(w.name)).join(' e ');
      const verb = r.winners.length > 1 ? 'dividiram' : 'levou';
      return `<div><strong>${who}</strong> ${verb} ${amt(r.amount)}${r.handName ? ` com ${esc(r.handName.toLowerCase())}` : ''}${contested > 1 ? ` <span class="note">(${esc(r.label.toLowerCase())})</span>` : ''}</div>`;
    }).join('');
    if (T && T.finished) msg += `<div style="margin-top:6px"><strong>🏆 ${esc(T.places[0].name)} venceu o torneio!</strong></div>`;
  }
  $('centerMsg').innerHTML = msg;
  $('startBtn').hidden = !(isHost && state.phase === 'waiting' && !state.started);
  $('startBtn').disabled = seated < 2;
  $('showBtn').hidden = !(showdown && state.showOffer && state.showOffer.seat === my && state.showOffer.handNumber === state.handNumber);

  renderMe(my);
  updateTimers();
  animateChanges(prevSnap, state, my);
  prevSnap = snapshot(state);

  // fim do torneio: pódio
  if (T && T.finished) {
    const key = `${state.code}-${T.startedAt}`;
    if (summaryShownFor !== key) { summaryShownFor = key; setTimeout(() => { if (state && state.tourney && state.tourney.finished) openSummary(state, false); }, 3500); }
  }
}

function renderBlindsLine() {
  if (!state) return;
  const b = state.blinds;
  const T = state.tourney;
  const tour = E.isTourney(state);
  $('idText').textContent = tableId.toUpperCase() + (tour && T && !T.finished ? ` · Nível ${b.level + 1}` : '');
  let t = `${fmt(b.sb)}/${fmt(b.bb)}${b.ante ? ` · ante ${fmt(b.ante)}` : ''}`;
  if (T && !T.finished && T.nextLevelAt) {
    const left = Math.max(0, T.nextLevelAt - now());
    const m = Math.floor(left / 60000), sec = Math.floor((left % 60000) / 1000);
    t += left > 0 ? ` · ⏱ <b>${m}:${String(sec).padStart(2, '0')}</b>` : ' · <b>sobe já</b>';
  } else if (!tour && state.handNumber) t += ` · Mão #${state.handNumber}`;
  $('blindsText').innerHTML = t;
}

function renderMe(my) {
  const s = my >= 0 ? state.seats[my] : null;
  $('myHand').textContent = s && s.folded && active() ? 'Você desistiu' : '';

  $('offlineBubble').hidden = !(s && s.sitOut && !s.eliminated && !s.waitingReentry);
  $('reactBtn').hidden = !s;

  const pending = Date.now() < pendingUntil;
  const L = s && !s.sitOut ? legal(my) : null;
  $('actions').hidden = !L;
  document.querySelectorAll('#actions .btn, #raisePanel .btn').forEach((b) => (b.disabled = pending));

  // pré-ações: quando estou na mão e não é minha vez
  const preKey = `${state.handNumber}-${state.phase}`;
  if (pre && pre.key !== preKey) pre = null;
  if (pre && pre.type === 'check' && pre.bet !== state.currentBet) pre = null; // alguém apostou
  const canPre = s && !L && active() && s.inHand && !s.folded && !s.allIn && !s.sitOut;
  $('preBox').hidden = !canPre;
  if (canPre) {
    const owes = state.currentBet > s.bet;
    document.querySelectorAll('[data-pre]').forEach((b) => {
      b.setAttribute('aria-pressed', !!pre && pre.type === b.dataset.pre);
      if (b.dataset.pre === 'check') b.hidden = owes;
      if (b.dataset.pre === 'checkfold') b.textContent = owes ? 'Desistir' : 'Passar/ Desistir';
      if (b.dataset.pre === 'callany') b.textContent = owes ? `Pagar ${amt(state.currentBet - s.bet)}` : 'Pagar qualquer';
    });
    $('preBox').style.gridTemplateColumns = owes ? '1fr 1fr' : 'repeat(3, 1fr)';
  }

  let note = '';
  if (!s) note = E.isTourney(state) && state.tourney && !state.tourney.finished ? 'Você está assistindo. Entra no próximo torneio.' : 'Você está assistindo.';
  else if (L) note = '';
  else if (s.eliminated) note = `Você ficou em ${s.place}º lugar. Assista até o fim do torneio.`;
  else if (s.waitingReentry) note = `<div style="display:grid;gap:8px;width:100%"><div>Você quebrou! A reentrada fica aberta até o fim do nível ${state.settings.reentryLevels}.</div>
    <div style="display:grid;grid-template-columns:1.4fr 1fr;gap:8px"><button class="btn btn-fire" id="reenterBtn">Reentrar com ${fmt(state.settings.startingStack)}</button><button class="btn" id="declineBtn">Sair do torneio</button></div></div>`;
  else if (s.sitOut) note = 'Você está offline. Toque no balão no canto para voltar.';
  else if (s.stack === 0 && !(s.inHand && active() && !s.folded)) note = state.settings.allowRebuy
    ? `<button class="btn btn-gold" id="rebuyBtn">Recomprar ${fmt(state.settings.startingStack)} fichas</button>` : 'Suas fichas acabaram.';
  else if (active() && s.inHand && !s.folded) {
    const t = state.seats[state.toAct];
    note = s.allIn ? 'Você está all-in.' : (t ? `Vez de ${esc(t.name)}` : '');
  } else if (active() && !s.inHand) note = 'Você entra na próxima mão.';
  else if (state.phase === 'showdown' && !(state.tourney && state.tourney.finished)) note = 'Próxima mão em instantes…';
  $('waitNote').innerHTML = note;
  $('waitNote').hidden = !!L || (canPre && !note);
  if (canPre) $('waitNote').hidden = true;
  if ($('rebuyBtn')) $('rebuyBtn').onclick = () => send('rebuy');
  if ($('reenterBtn')) $('reenterBtn').onclick = () => send('reenter');
  if ($('declineBtn')) $('declineBtn').onclick = () => { if (confirm('Sair do torneio sem reentrar?')) send('noreenter'); };

  if (L) {
    $('callBtn').innerHTML = L.canCheck ? 'Passar' : `Pagar<b>${amt(L.toCall)}</b>`;
    $('raiseBtn').disabled = pending || !L.canRaise;
    if (L.canRaise) {
      const r = $('raiseRange');
      r.min = L.minTo; r.max = L.maxTo; r.step = Math.max(1, Math.floor(state.blinds.sb));
      const key = `${state.handNumber}-${state.phase}-${state.currentBet}`;
      if (raiseKey !== key || raiseTo < L.minTo || raiseTo > L.maxTo) { raiseTo = L.minTo; raiseKey = key; }
      r.value = raiseTo;
      $('raiseAmt').textContent = amt(raiseTo);
      const label = state.currentBet === 0 ? 'Apostar' : 'Aumentar';
      $('raiseLabel').textContent = state.currentBet === 0 ? 'Apostar' : 'Aumentar para';
      $('raiseBtn').innerHTML = raiseOpen ? `${raiseTo === L.maxTo ? 'All-in' : label}<b>${amt(raiseTo)}</b>` : label;
    } else {
      $('raiseBtn').textContent = 'Aumentar';
      raiseOpen = false;
    }
    $('raisePanel').hidden = !raiseOpen;
    const key = `${state.handNumber}-${state.phase}-${state.toAct}-${state.currentBet}`;
    if (key !== lastTurnKey) {
      lastTurnKey = key;
      if (!runPreAction(L)) { Sfx.turn(); buzz(); }
    }
  } else {
    raiseOpen = false;
    $('raisePanel').hidden = true;
  }
}

/* Onde fica a ficha da aposta de cada lugar: perto do jogador, sem cobrir a mesa nem o logo */
function betPos(x, y, hero) {
  const sx = x < 49 ? 1 : x > 51 ? -1 : 0;
  if (hero) return { bx: x, by: y - 12 };
  if (y >= 75) return { bx: x + sx * 14, by: y - 14 };
  if (y >= 64) return { bx: x + sx * 21, by: y - 4 };
  if (y >= 56) return { bx: x + sx * 7, by: y + 11 };
  if (y >= 42) return { bx: x + sx * 7, by: y - 11 };
  if (y >= 25) return { bx: x + sx * 19, by: y + 12 };
  return { bx: x, by: y + 15 };
}

let lastRevealHand = -1;
const isMeSeat = (i, my) => i === my;
function myCardsNow() {
  const my = mySeatIdx(); const s = my >= 0 ? state.seats[my] : null;
  return s && myHand && myHand.handNumber === state.handNumber && s.inHand && state.handNumber > 0 ? myHand.cards : null;
}
function handLabelTxt() {
  const c = myCardsNow(); if (!c) return '';
  const all = [...c, ...state.board];
  if (all.length >= 5) return E.bestHand(all).name;
  return c[0][0] === c[1][0] ? 'Par na mão' : (c[0][1] === c[1][1] ? 'Mesmo naipe' : '');
}

function myBankLeft(s, i) {
  if (state.usingBank && state.toAct === i) return Math.max(0, state.deadline - now());
  return s.timeBank || 0;
}

// executa a pré-ação marcada quando chega a minha vez
function runPreAction(L) {
  if (!pre) return false;
  const type = pre.type; pre = null;
  let action = null;
  if (type === 'checkfold') action = L.canCheck ? 'check' : 'fold';
  else if (type === 'check') action = L.canCheck ? 'check' : null;
  else if (type === 'callany') action = L.canCheck ? 'check' : 'call';
  if (!action) return false;
  setTimeout(() => { if (legal(mySeatIdx())) sendAction(action); }, 250);
  return true;
}

document.querySelectorAll('[data-pre]').forEach((b) => {
  b.onclick = () => {
    const t = b.dataset.pre;
    pre = pre && pre.type === t ? null : { type: t, key: `${state.handNumber}-${state.phase}`, bet: state.currentBet };
    render();
  };
});

function buzz() {
  if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return;
  try { navigator.vibrate && navigator.vibrate(60); } catch {}
}

/* ==================================================================
   ANIMAÇÕES
   ================================================================== */
function snapshot(st) {
  return {
    hand: st.handNumber, phase: st.phase, board: st.board.length,
    bets: st.seats.map((s) => (s ? s.bet : 0)),
    acts: st.seats.map((s) => (s ? s.lastAction : '')),
    folded: st.seats.map((s) => (s ? s.folded : false)),
    inHand: st.seats.map((s) => !!(s && s.inHand)),
    results: !!st.results,
  };
}

function fly(html, from, to, o = {}) {
  if (!from || !to || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const el = document.createElement('div');
  el.className = 'fly'; el.innerHTML = html;
  $('fx').appendChild(el);
  const w = el.offsetWidth / 2, h = el.offsetHeight / 2;
  const a = el.animate([
    { transform: `translate(${from.x - w}px, ${from.y - h}px) scale(${o.s0 || 1}) rotate(${o.r0 || 0}deg)`, opacity: o.o0 ?? 1 },
    { transform: `translate(${to.x - w}px, ${to.y - h}px) scale(${o.s1 || 1}) rotate(${o.r1 || 0}deg)`, opacity: o.o1 ?? 1 },
  ], { duration: o.dur || 420, delay: o.delay || 0, easing: o.ease || 'cubic-bezier(.25,.8,.25,1)', fill: 'both' });
  a.onfinish = () => el.remove();
}

function animateChanges(prev, st, my) {
  if (!prev) return;
  const seats = geo.seats, center = geo.center, pot = geo.pot;
  const mine = (i) => seats[i];

  // nova mão: embaralha e distribui uma a uma
  if (st.handNumber > prev.hand && st.phase === 'preflop') {
    Sfx.shuffle();
    const order = [];
    for (let k = 1; k <= 9; k++) { const i = (st.dealer + k) % 9; if (st.seats[i] && st.seats[i].inHand) order.push(i); }
    let n = 0;
    for (let r = 0; r < 2; r++) for (const i of order) {
      const d = 300 + n * 90; n++;
      fly(cardHTML(null, '', '--w:26px'), center, mine(i), { delay: d, dur: 320, r0: -30, r1: r ? 8 : -8, o1: i === my ? 0 : 1, s1: 1 });
      Sfx.deal(d / 1000);
    }
    return;
  }
  if (st.handNumber !== prev.hand) return;

  // apostas, pagamentos, passes e desistências
  st.seats.forEach((s, i) => {
    if (!s || !seats[i]) return;
    if (s.bet > prev.bets[i]) {
      fly(chipStack(s.bet - prev.bets[i], 4), seats[i], { x: seats[i].bx, y: seats[i].by }, { dur: 320 });
      Sfx.chip();
    } else if (s.lastAction === 'Passou' && prev.acts[i] !== 'Passou') Sfx.check();
    if (s.folded && !prev.folded[i]) {
      fly(cardHTML(null, '', '--w:24px'), seats[i], center, { dur: 380, o1: 0, r1: 40, s1: 0.8 });
      Sfx.fold();
    }
  });

  // fim da rodada de apostas: fichas vão para o pote
  const collect = (st.board.length > prev.board || (st.phase === 'showdown' && prev.phase !== 'showdown'));
  if (collect) {
    let any = false;
    prev.bets.forEach((b, i) => {
      if (b > 0 && seats[i]) { any = true; fly(chipStack(b, 4), { x: seats[i].bx, y: seats[i].by }, pot, { dur: 380, delay: 60 }); }
    });
    if (any) Sfx.chips(0.05);
    for (let k = prev.board; k < st.board.length; k++) Sfx.flip(0.3 + (k - prev.board) * 0.15);
  }

  // resultado: pote vai para o vencedor
  if (st.phase === 'showdown' && st.results && !prev.results) {
    const wait = collect ? 700 : 200;
    let iWon = false;
    for (const r of st.results) {
      for (const w of r.winners) {
        if (!seats[w.seat]) continue;
        if (w.seat === my && !r.returned) iWon = true;
        fly(chipPile(Math.max(1, Math.floor(r.amount / r.winners.length))), pot, seats[w.seat], { delay: wait + 600, dur: 600 });
      }
    }
    setTimeout(() => (iWon ? Sfx.win() : Sfx.chips()), wait + 700);
  }
}

/* ---------- Reações ---------- */
function showReaction(seat, text) {
  const p = geo.seats[seat]; if (!p) return;
  const el = document.createElement('div');
  el.className = `bubble ${EMOJIS.includes(text) ? 'emoji' : ''}`;
  el.textContent = text;
  el.style.left = `${p.x}px`; el.style.top = `${p.y - 30}px`;
  $('fx').appendChild(el);
  Sfx.pop();
  setTimeout(() => el.remove(), 2900);
}
$('reactBtn').onclick = () => {
  openSheet(`<h2>Reagir</h2>
    <div class="react-grid">${EMOJIS.map((e) => `<button data-r="${e}">${e}</button>`).join('')}</div>
    <div class="phrases">${PHRASES.map((p) => `<button data-r="${esc(p)}">${esc(p)}</button>`).join('')}</div>`);
  document.querySelectorAll('[data-r]').forEach((b) => { b.onclick = () => { closeSheet(); send('react', { text: b.dataset.r }); }; });
};

/* ---------- Ações ---------- */
const sendAction = (action, amount) => { raiseOpen = false; pre = null; send('act', { action, amount, handNumber: state.handNumber }); };

$('foldBtn').onclick = () => {
  const L = legal(mySeatIdx());
  if (L && L.canCheck && !confirm('Você pode passar de graça. Desistir mesmo assim?')) return;
  sendAction('fold');
};
$('callBtn').onclick = () => { const L = legal(mySeatIdx()); if (L) sendAction(L.canCheck ? 'check' : 'call'); };
$('raiseBtn').onclick = () => {
  if (!raiseOpen) { raiseOpen = true; render(); return; }
  sendAction('raise', raiseTo);
};
$('raiseRange').oninput = (e) => {
  raiseTo = +e.target.value;
  const L = legal(mySeatIdx());
  if (L && raiseTo >= L.maxTo - (+e.target.step) + 1) raiseTo = L.maxTo;
  render();
};
document.querySelectorAll('[data-preset]').forEach((b) => {
  b.onclick = () => {
    const L = legal(mySeatIdx()); if (!L) return;
    const potAfterCall = potTotal() + L.toCall;
    const p = b.dataset.preset;
    const to = p === 'min' ? L.minTo : p === 'all' ? L.maxTo : state.currentBet + Math.round(potAfterCall * (p === 'half' ? 0.5 : 1));
    raiseTo = Math.max(L.minTo, Math.min(L.maxTo, to));
    render();
  };
});
$('startBtn').onclick = () => send('start');
$('showBtn').onclick = () => send('show');
$('offlineBubble').onclick = () => send('sitout', { value: false });

$('idBtn').onclick = () => shareText(`Bora jogar poker no PokerTrama! 🔥\nMesa: ${tableId.toUpperCase()}\nSenha: ${tablePw}`);

/* ---------- Placar e menu ---------- */
function openSheet(html) { $('sheet').innerHTML = html; $('sheetBg').hidden = false; }
function closeSheet() { $('sheetBg').hidden = true; }
$('sheetBg').onclick = (e) => { if (e.target === $('sheetBg')) closeSheet(); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeSheet(); } });

$('scoreBtn').onclick = () => openRanking();
function openRanking() {
  if (!state) return;
  const tour = E.isTourney(state);
  const bb = curBB();
  const chips = (s) => s.stack + (active() ? s.committed : 0);
  const seated = state.seats.filter(Boolean);
  const alive = seated.filter((s) => !s.eliminated && !s.waitingReentry).sort((a, b) => chips(b) - chips(a));
  const waiting = seated.filter((s) => s.waitingReentry);
  const out = seated.filter((s) => s.eliminated).sort((a, b) => a.place - b.place);
  const bbTxt = (n) => `${(Math.round((n / bb) * 10) / 10).toLocaleString('pt-BR', { maximumFractionDigits: 1 })} BB`;
  const avg = alive.length ? Math.round(alive.reduce((t, s) => t + chips(s), 0) / alive.length) : 0;
  const row = (pos, s, right, cls = '') => `<tr class="${s.uid === myId ? 'is-me' : ''} ${cls}"><td>${pos}</td>
    <td><div class="who">${avaHTML(s.name, s.color, avatars[s.uid])}<span>${esc(s.name)}</span>${s.rebuys ? `<i class="re">↻${s.rebuys}</i>` : ''}</div></td><td>${right}</td></tr>`;
  const entrants = seated.length;
  openSheet(`<h2>Ranking</h2>
    <p class="rank-meta">${tour ? `Restam ${alive.length} de ${entrants} · ` : ''}Média ${fmt(avg)} (${bbTxt(avg)})${tour && state.tourney && !state.tourney.finished ? ` · Nível ${state.blinds.level + 1}` : ''}</p>
    <table class="rank"><tr><th>Posição</th><th>Jogadores</th><th>Fichas (BB)</th></tr>
    ${alive.map((s, k) => row(k + 1, s, `${fmt(chips(s))} <small>(${bbTxt(chips(s))})</small>`)).join('')}
    ${waiting.map((s) => row('—', s, '<small>pode reentrar</small>', 'out')).join('')}
    ${out.map((s) => row(s.place, s, '<small>eliminado</small>', 'out')).join('')}
    </table>
    <p style="color:var(--muted);font-size:12px;margin:10px 0 0">↻ = número de ${tour ? 'reentradas' : 'recompras'}.</p>`);
}

$('menuBtn').onclick = () => {
  if (!state) return;
  const my = mySeatIdx(); const s = my >= 0 ? state.seats[my] : null;
  const isHost = mode === 'host';
  const set = state.settings;
  const log = state.log.slice().reverse().map((l) => `<li class="${l.startsWith('—') ? 'sep' : ''}">${esc(l)}</li>`).join('');
  openSheet(`<h2>Mesa ${esc(tableId.toUpperCase())}</h2>
    <div class="cred">ID <b>${esc(tableId.toUpperCase())}</b> &nbsp; Senha <b>${esc(tablePw)}</b></div>
    <div class="sheet-actions">
      <button class="btn btn-small btn-gold" id="sumBtn">Resumo da noite</button>
      ${E.isTourney(state) ? '<button class="btn btn-small" id="structBtn">Estrutura de blinds</button>' : ''}
      <button class="btn btn-small" id="soundBtn">${Sfx.on ? '🔊 Som ligado' : '🔇 Som desligado'}</button>
      ${s && !s.sitOut && !s.eliminated ? '<button class="btn btn-small" id="sitBtn">Ficar offline</button>' : ''}
      <button class="btn btn-small" id="leaveBtn">${isHost ? 'Encerrar a mesa' : 'Sair da mesa'}</button>
    </div>
    ${isHost ? '<p style="color:var(--muted);font-size:14px;margin:0 0 10px">Você é o anfitrião: mantenha o app aberto e a tela ligada para o jogo continuar.</p>' : ''}
    <p style="color:var(--muted);font-size:14px;margin:0 0 14px">${E.isTourney(state) ? `Torneio · ${fmt(set.startingStack)} fichas · blinds sobem a cada ${set.levelMinutes} min` : `Cash · ${fmt(set.startingStack)} fichas · recompra ${set.allowRebuy ? 'liberada' : 'desligada'}`} · 30 s por jogada + ${set.timeBankSeconds} s de banco</p>
    ${isHost && state.seats.filter(Boolean).length > 1 ? `<h2 style="font-size:20px">Jogadores</h2><div class="sheet-actions">${state.seats.map((x, i) => x && x.uid !== myId ? `<button class="btn btn-small" data-kick="${i}">Remover ${esc(x.name)}</button>` : '').join('')}</div>` : ''}
    <h2 style="font-size:20px">Histórico</h2><ul class="log">${log}</ul>`);
  document.querySelectorAll('[data-kick]').forEach((b) => {
    b.onclick = () => {
      const x = state.seats[+b.dataset.kick];
      if (x && confirm(`Remover ${x.name} da mesa?`)) { closeSheet(); send('kick', { seat: +b.dataset.kick }); }
    };
  });
  if ($('structBtn')) $('structBtn').onclick = () => {
    const cur = state.tourney && !state.tourney.finished ? state.blinds.level : -1;
    const rows = E.structure(state).slice(0, 16).map((l, i) => `<tr><td class="${i === cur ? 'cur' : ''}">${i + 1}${i === cur ? ' ◀' : ''}</td><td class="${i === cur ? 'cur' : ''}">${fmt(l.sb)} | ${fmt(l.bb)}</td><td>${fmt(l.ante)}</td><td>${l.ms / 60000} min${state.settings.reentryLevels === i + 1 ? ' · fim da reentrada' : ''}</td></tr>`).join('');
    openSheet(`<h2>Estrutura de blinds</h2><table class="score struct"><tr><th>Nível</th><th>Blinds</th><th>Ante</th><th>Intervalo</th></tr>${rows}</table>`);
  };
  $('sumBtn').onclick = () => { closeSheet(); openSummary(state, false); };
  $('soundBtn').onclick = () => { Sfx.on = !Sfx.on; lsSet('pt.sound', Sfx.on ? 'on' : 'off'); Sfx.unlock(); $('menuBtn').click(); };
  if ($('sitBtn')) $('sitBtn').onclick = () => { closeSheet(); send('sitout', { value: true }); };
  $('leaveBtn').onclick = () => {
    if (isHost) {
      if (!confirm('Encerrar a mesa? Todos verão o resumo da noite e serão desconectados.')) return;
      const last = state;
      closeSheet(); leaveLocal();
      if (last.handNumber > 0) openSummary(last, true);
      return;
    }
    if (s && s.inHand && active() && !s.folded && !confirm('Você está numa mão. Sair agora desiste dela. Sair?')) return;
    Client.send('leave'); lsSet('pt.last', null);
    setTimeout(leaveLocal, 300);
  };
};

/* ---------- Resumo da noite / pódio ---------- */
function nightData(st) {
  const players = Object.entries(st.stats || {}).map(([uid, x]) => {
    const seat = st.seats.find((s) => s && s.uid === uid);
    return { uid, name: x.name, handsWon: x.handsWon, handsPlayed: x.handsPlayed, tourneyWins: x.tourneyWins, biggestWin: x.biggestWin,
      color: seat ? seat.color : '#555', rebuys: seat ? seat.rebuys : 0, net: seat ? seat.stack - st.settings.startingStack * (1 + seat.rebuys) : null };
  }).filter((p) => p.handsPlayed > 0);
  players.sort((a, b) => (b.tourneyWins - a.tourneyWins) || (b.handsWon - a.handsWon));
  return { players, rec: st.records || {} };
}

function openSummary(st, final) {
  const T = st.tourney;
  const tour = E.isTourney(st);
  const { players, rec } = nightData(st);
  const podium = T && T.finished ? T.places.slice(0, 3) : null;
  const pod = (p, n) => p ? `<div class="pod p${n}"><div class="medal">${['🥇', '🥈', '🥉'][n - 1]}</div>${avaHTML(p.name, p.color, avatars[p.uid])}<div class="nm">${esc(p.name)}</div><div class="block">${n}º</div></div>` : '<div></div>';
  const date = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: '2-digit' });
  const isHost = mode === 'host';
  const best = rec.bestHand, big = rec.biggestPot;
  $('summary').innerHTML = `<div class="sum">
    <h1>${podium ? '🏆 Fim do torneio' : 'Resumo da noite'}</h1>
    <p class="date">PokerTrama · mesa ${esc(String(st.code || '').toUpperCase())} · ${esc(date)}</p>
    ${podium ? `<div class="podium">${pod(podium[1], 2)}${pod(podium[0], 1)}${pod(podium[2], 3)}</div>` : ''}
    <div class="sum-card"><h3>Destaques</h3>
      ${big ? `<div class="rec"><span>💰 Maior pote<br><small style="color:var(--muted)">${esc(big.names.join(' e '))}${big.hand ? ` · ${esc(big.hand)}` : ''}</small></span><b>${fmt(big.amount)}</b></div>` : ''}
      ${best ? `<div class="rec"><span>🃏 Melhor mão<br><small style="color:var(--muted)">${esc(best.by)} · ${esc(best.name)}</small></span><span class="mini">${best.cards.map((c) => cardHTML(c)).join('')}</span></div>` : ''}
      ${!big && !best ? '<div class="rec"><span style="color:var(--muted)">Ainda não teve mão completa.</span></div>' : ''}
    </div>
    <div class="sum-card"><h3>Jogadores</h3>
      <table class="score"><tr><th>Jogador</th><th>Mãos vencidas</th>${tour ? '<th>Torneios</th>' : '<th>Saldo</th>'}</tr>
      ${players.map((p) => `<tr><td>${esc(p.name)}${p.rebuys ? `<i class="re">↻${p.rebuys}</i>` : ''}</td><td>${p.handsWon} de ${p.handsPlayed}</td>${tour ? `<td>${p.tourneyWins ? '🏆'.repeat(Math.min(3, p.tourneyWins)) + (p.tourneyWins > 3 ? ` ${p.tourneyWins}` : '') : '—'}</td>`
        : `<td class="${p.net > 0 ? 'pos' : p.net < 0 ? 'neg' : ''}">${p.net === null ? '—' : (p.net > 0 ? '+' : '') + fmt(p.net)}</td>`}</tr>`).join('')}
      </table>
    </div>
    <div class="sum-actions">
      <button class="btn btn-fire" id="sumShare">Mandar no grupo</button>
      ${podium && isHost && !final ? '<button class="btn btn-gold" id="sumNew">Começar outro torneio</button>' : ''}
      <button class="btn" id="sumClose">${final ? 'Voltar ao início' : 'Voltar para a mesa'}</button>
    </div>
  </div>`;
  $('summary').hidden = false;
  $('sumShare').onclick = () => shareText(summaryText(st));
  $('sumClose').onclick = () => { $('summary').hidden = true; };
  if ($('sumNew')) $('sumNew').onclick = () => { $('summary').hidden = true; send('newtourney'); };
}

function summaryText(st) {
  const { players, rec } = nightData(st);
  const T = st.tourney;
  const L = [`🔥 PokerTrama — ${T && T.finished ? 'Resultado do torneio' : 'Resumo da noite'} (${new Date().toLocaleDateString('pt-BR')})`];
  if (T && T.finished) {
    const m = ['🏆', '🥈', '🥉'];
    T.places.slice(0, 3).forEach((p, i) => L.push(`${m[i]} ${p.place}º ${p.name}`));
  }
  if (rec.biggestPot) L.push(`💰 Maior pote: ${fmt(rec.biggestPot.amount)} — ${rec.biggestPot.names.join(' e ')}${rec.biggestPot.hand ? ` (${rec.biggestPot.hand})` : ''}`);
  if (rec.bestHand) L.push(`🃏 Melhor mão: ${rec.bestHand.name} — ${rec.bestHand.by}`);
  if (players.length) L.push('', '📊 Mãos vencidas:', ...players.map((p) => `• ${p.name}${p.rebuys ? ` (↻${p.rebuys})` : ''}: ${p.handsWon}${p.tourneyWins ? ` · ${p.tourneyWins}× campeão` : ''}`));
  return L.join('\n');
}

/* ---------- Relógio da vez ---------- */
function updateTimers() {
  if (!state) return;
  renderBlindsLine();
  const my = mySeatIdx();
  if (my >= 0 && state.seats[my] && state.settings.timeBankSeconds > 0 && !state.seats[my].eliminated && $('myBank')) {
    $('myBank').textContent = Math.ceil(myBankLeft(state.seats[my], my) / 1000);
  }
  if (!active() || !state.deadline) return;
  const s = state.seats[state.toAct];
  const total = state.usingBank ? Math.max(1000, (s && s.timeBank) || 1000) : state.settings.turnSeconds * 1000;
  const left = Math.max(0, state.deadline - now());
  const el = document.querySelector(`.seat[data-seat="${state.toAct}"]`);
  if (el) {
    el.style.setProperty('--p', Math.min(1, left / total).toFixed(3));
    el.classList.toggle('urgent', !state.usingBank && left < 8000);
  }
}
setInterval(() => { if (mode === 'client') updateTimers(); }, 250);
addEventListener('resize', () => { if (state) { prevSnap = null; render(); } });

/* ---------- Tela sempre ligada ---------- */
let wakeLock = null;
const NativeAwake = window.Capacitor && window.Capacitor.registerPlugin ? window.Capacitor.registerPlugin('KeepAwake') : null;
async function keepAwake() {
  if (NativeAwake) { try { await NativeAwake.keepAwake(); return; } catch {} }
  try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch {}
}
function releaseAwake() {
  if (NativeAwake) NativeAwake.allowSleep().catch(() => {});
  try { wakeLock && wakeLock.release(); } catch {} wakeLock = null;
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && mode) {
    keepAwake();
    if (mode === 'client' && performance.now() - Client.lastMsg > 6000) Client.reconnectSoon();
  }
});

/* ---------- Início ---------- */
if (typeof Peer === 'undefined' || !E) {
  document.body.innerHTML = '<p style="padding:24px">Não foi possível carregar o jogo. Reinstale o app.</p>';
  return;
}
setCreateMode('torneio');
fillLobby();
show('lobby');
if ('serviceWorker' in navigator && location.protocol === 'https:' && !window.Capacitor) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
window.__pt = { get state() { return state; }, get mode() { return mode; }, myId, Host, get pre() { return pre; } };
})();
</script>
