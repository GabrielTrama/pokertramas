<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PokerTrama</title>
<meta name="theme-color" content="#0A0B0E">
<meta name="description" content="Poker Texas Hold'em com os amigos. Entre com o ID da mesa e a senha.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="peerjs.min.js"></script>
<script src="engine.js"></script>
<style>
@font-face { font-family: 'Big Shoulders Display'; font-weight: 600; font-display: swap; src: url(fonts/big-shoulders-display-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: 'Big Shoulders Display'; font-weight: 800; font-display: swap; src: url(fonts/big-shoulders-display-latin-800-normal.woff2) format('woff2'); }
@font-face { font-family: 'Figtree'; font-weight: 400; font-display: swap; src: url(fonts/figtree-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: 'Figtree'; font-weight: 500; font-display: swap; src: url(fonts/figtree-latin-500-normal.woff2) format('woff2'); }
@font-face { font-family: 'Figtree'; font-weight: 600; font-display: swap; src: url(fonts/figtree-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: 'Figtree'; font-weight: 700; font-display: swap; src: url(fonts/figtree-latin-700-normal.woff2) format('woff2'); }

:root {
  --bg: #0A0B0E;
  --panel: #15181D;
  --panel-2: #1D2128;
  --line: rgba(255,255,255,.09);
  --text: #F4F1EA;
  --muted: #98A1AC;
  --gold: #F2B33D;
  --gold-hi: #FFD772;
  --red: #E0362C;
  --green: #2EAD62;
  --blue: #2F80ED;
  --fire: linear-gradient(135deg, #FF9F1C 0%, #FF5A1F 45%, #D7261E 100%);
  --felt-1: #23845C;
  --felt-2: #136443;
  --felt-3: #0A3B28;
  --display: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
  --body: 'Figtree', system-ui, sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font: 400 16px/1.45 var(--body);
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
  user-select: none; -webkit-user-select: none;
}
input { user-select: text; -webkit-user-select: text; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- Abertura ---------- */
#splash {
  position: fixed; inset: 0; z-index: 70; overflow: hidden; display: grid; place-items: center;
  background: radial-gradient(70% 40% at 50% 50%, #3A0E05 0%, #070303 70%);
  transition: opacity .5s ease;
}
#splash.bye { opacity: 0; pointer-events: none; }
#splash .flames {
  position: absolute; left: -10px; right: -10px; bottom: -10px; height: 50%;
  background: url(abertura-chamas.jpg) center bottom / cover no-repeat;
  -webkit-mask: linear-gradient(to top, #000 50%, rgba(0,0,0,.6) 80%, transparent); mask: linear-gradient(to top, #000 50%, rgba(0,0,0,.6) 80%, transparent);
  animation: brasa 2.4s ease-in-out infinite alternate;
}
#splash .flames.top { top: 0; bottom: auto; height: 30%; transform: scaleY(-1); opacity: .22; animation: none; }
@keyframes brasa { from { filter: blur(1.5px) brightness(.7); } to { filter: blur(1.5px) brightness(.9); } }
#splash img { position: relative; width: min(100%, 1100px); height: auto; display: block; animation: entrada 1.1s cubic-bezier(.2,.8,.2,1) both; }
@keyframes entrada { from { opacity: 0; transform: scale(1.08); } }
@media (orientation: portrait) { #splash img { width: 112%; max-width: none; } }

/* ---------- Botões ---------- */
.btn {
  border: 0; border-radius: 12px; padding: 12px 18px; min-height: 48px;
  font-weight: 700; letter-spacing: .01em;
  background: var(--panel-2); color: var(--text);
  box-shadow: inset 0 0 0 1px var(--line);
  transition: transform .08s ease, filter .15s;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .45; cursor: default; }
.btn-fire { background: var(--fire); color: #fff; box-shadow: 0 6px 18px rgba(229,64,30,.35); text-shadow: 0 1px 1px rgba(0,0,0,.25); }
.btn-gold { background: linear-gradient(180deg, var(--gold-hi), var(--gold)); color: #2A1A00; box-shadow: 0 6px 18px rgba(242,179,61,.25); }
.btn-light { background: var(--text); color: #15181D; box-shadow: none; }
.btn-ghost { background: transparent; }
.btn-small { min-height: 36px; padding: 6px 12px; font-size: 14px; border-radius: 10px; }
.btn-wide { width: 100%; }

/* ---------- Lobby ---------- */
#lobby { min-height: 100%; display: grid; place-items: start center; padding: 0 16px calc(28px + var(--safe-b)); }
.lobby-box { width: 100%; max-width: 400px; }
.lobby-logo { display: block; width: calc(100% + 32px); margin: 0 -16px 6px; height: auto;
  -webkit-mask: linear-gradient(to bottom, #000 70%, transparent); mask: linear-gradient(to bottom, #000 70%, transparent); }
.profile { display: flex; gap: 14px; align-items: center; margin-bottom: 10px; }
.profile .field { flex: 1; margin: 0; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 18px; }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 0; padding: 0; background: var(--c); box-shadow: inset 0 0 0 2px rgba(0,0,0,.25); }
.sw[aria-pressed=true] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--text); }
.photo-btn { border: 1px dashed rgba(255,255,255,.35); background: none; border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--muted); min-height: 30px; }
.field { display: block; margin-bottom: 14px; }
.field > span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.input {
  width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 12px;
  background: var(--panel); border: 1px solid var(--line);
}
.input:focus { border-color: var(--gold); outline: none; }
.id-input { text-transform: uppercase; letter-spacing: .12em; font: 800 22px/1 var(--display); }
.or { display: flex; align-items: center; gap: 12px; color: var(--muted); margin: 22px 0 16px; font-size: 13px; }
.or::before, .or::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.seg { display: grid; grid-template-columns: 1fr 1fr; padding: 4px; background: var(--panel); border-radius: 12px; border: 1px solid var(--line); margin-bottom: 12px; }
.seg button { border: 0; background: none; border-radius: 9px; padding: 9px; font-weight: 700; color: var(--muted); }
.seg button small { display: block; font-weight: 500; font-size: 11px; }
.seg button[aria-pressed=true] { background: var(--panel-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--gold); }
details.settings { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
details.settings summary { cursor: pointer; padding: 6px 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.grid2 .field { margin: 0; }
.check { display: flex; gap: 8px; align-items: center; margin-top: 12px; color: var(--text); }
.resume { border: 1px solid var(--gold); border-radius: 14px; padding: 14px; margin-bottom: 18px; display: grid; gap: 10px; background: rgba(242,179,61,.06); }
.resume b { font: 800 22px/1 var(--display); letter-spacing: .08em; }
.resume .row { display: flex; gap: 8px; }
.resume .row .btn { flex: 1; }
.lobby-err { color: #FF8A7A; font-size: 14px; min-height: 20px; margin: 10px 0 0; text-align: center; }

/* ---------- Avatar ---------- */
.ava {
  --pc: #555; width: 52px; height: 52px; border-radius: 50%; position: relative; flex: none;
  display: grid; place-items: center; overflow: visible;
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--pc) 75%, white), var(--pc) 70%);
  font: 800 24px/1 var(--display); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.45);
  box-shadow: 0 0 0 2.5px #0E1013, 0 0 0 4px rgba(255,255,255,.18), 0 6px 14px rgba(0,0,0,.55);
}
.ava img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
.ava.lg { width: 64px; height: 64px; font-size: 30px; }

/* ---------- Mesa ---------- */
#game { height: 100%; display: flex; flex-direction: column;
  background: radial-gradient(90% 60% at 50% 45%, #1B1C1F 0%, #0E0F11 55%, #070708 100%); }
.topbar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; padding-top: max(10px, var(--safe-t)); }
.table-id { background: none; border: 0; padding: 4px; text-align: left; min-width: 0; flex: 1; }
.table-id b { display: block; font: 800 20px/1 var(--display); letter-spacing: .08em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.table-id small { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.table-id small b { display: inline; font: 700 12px var(--body); letter-spacing: 0; color: var(--gold-hi); }
.banner { margin: 0 12px; padding: 8px 12px; border-radius: 10px; font-size: 14px; text-align: center; background: rgba(224,54,44,.15); color: #FF9A8E; }

.table-wrap { flex: 1; position: relative; min-height: 0; }
/* aro de cobre + feltro verde, oval em pé como no app da GG */
.rail {
  position: absolute; inset: 44px 22px 64px; border-radius: 50% / 34%;
  background: linear-gradient(160deg, #D9A391 0%, #9C6A5C 30%, #6E463C 55%, #B98272 80%, #7A5045 100%);
  box-shadow: 0 0 0 2px #1A0F0C, 0 24px 60px rgba(0,0,0,.8), inset 0 1px 1px rgba(255,255,255,.35);
}
.felt {
  position: absolute; inset: 9px; border-radius: 50% / 34%;
  background:
    radial-gradient(ellipse 70% 45% at 50% 42%, rgba(120,200,150,.16), transparent 70%),
    repeating-radial-gradient(circle at 30% 20%, rgba(0,0,0,.03) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse at 50% 45%, #2A7A4E 0%, #1B5E3A 45%, #103D26 85%, #0B2D1C 100%);
  box-shadow: inset 0 0 0 2px rgba(0,0,0,.55), inset 0 0 40px rgba(0,0,0,.55);
}
.felt::after { content: ''; position: absolute; inset: 9% 10%; border-radius: 50% / 34%; border: 1.5px solid rgba(255,255,255,.06); }
.felt-logo {
  position: absolute; left: 50%; top: 31%; transform: translate(-50%, -50%);
  width: min(42%, 220px); aspect-ratio: 640 / 237; border-radius: 10px; overflow: hidden;
  box-shadow: 0 0 0 2px rgba(217,163,145,.85), 0 0 0 4px rgba(0,0,0,.45), 0 10px 26px rgba(0,0,0,.55);
  background: url(logo-mesa.webp) center / cover no-repeat; opacity: .92;
}
.center {
  position: absolute; left: 50%; top: 55%; transform: translate(-50%, -50%);
  width: min(82%, 440px); text-align: center; display: grid; gap: 10px; justify-items: center; z-index: 2;
}
.board { display: flex; gap: 5px; justify-content: center; min-height: 66px; }
.pot { display: flex; align-items: center; gap: 8px; min-height: 30px; }
.pot-pill { background: rgba(8,28,18,.62); border: 1px solid rgba(255,255,255,.07); border-radius: 999px; padding: 4px 22px; text-align: center; line-height: 1.15; }
.pot-pill small { display: block; font-size: 12px; color: rgba(255,255,255,.75); }
.pot-pill b { font: 800 19px var(--display); color: #FFD54F; letter-spacing: .02em; }
.pill { background: rgba(5,8,10,.72); border: 1px solid rgba(255,255,255,.08); border-radius: 999px; padding: 3px 10px; font: 700 15px/1.2 var(--display); letter-spacing: .02em; color: #fff; white-space: nowrap; }
.msg { font-size: 14px; max-width: 300px; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
.msg strong { color: var(--gold-hi); }
.msg .note { color: rgba(255,255,255,.75); }

.unit-btn { border: 1px solid var(--line); background: #1E1F23; color: var(--muted); border-radius: 999px; min-height: 34px; padding: 4px 11px; font: 800 15px var(--display); letter-spacing: .04em; }
.unit-btn[aria-pressed=true] { background: #FFD54F; color: #2A1A00; border-color: #FFD54F; }
.re { font-style: normal; font: 700 10px var(--body); color: #FFB45A; margin-left: 3px; vertical-align: 1px; }
.rank { width: 100%; border-collapse: collapse; font-size: 15px; table-layout: fixed; }
.rank th { color: var(--muted); font-weight: 500; font-size: 12px; text-align: left; padding: 8px; background: rgba(255,255,255,.05); }
.rank th:first-child { width: 64px; text-align: center; }
.rank th:last-child, .rank td:last-child { text-align: right; width: 42%; }
.rank td { padding: 10px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
.rank td:first-child { text-align: center; color: #D8D8D8; font: 700 17px var(--display); }
.rank .who { display: flex; align-items: center; gap: 8px; min-width: 0; }
.rank .who span { overflow: hidden; text-overflow: ellipsis; min-width: 0; padding: 2px 4px; border-radius: 4px; }
.rank .who .ava { width: 26px; height: 26px; font-size: 13px; box-shadow: 0 0 0 1.5px rgba(255,255,255,.2); }
.rank tr.is-me .who span { box-shadow: 0 0 0 2px #FFD54F; }
.rank tr.out td { color: #7D8590; }
.rank small { color: var(--muted); }
.rank-meta { color: var(--muted); font-size: 13px; margin: -4px 0 10px; }
.struct td.cur { color: var(--gold-hi); font-weight: 700; }

/* Cartas: baralho de 4 cores (copas vermelha, ouros azul, paus verde, espadas preta) */
.card {
  --w: 46px; --bg1: #2B2B2B; --bg2: #111; --edge: #555;
  width: var(--w); height: calc(var(--w) * 1.42); border-radius: calc(var(--w) * .1);
  background: linear-gradient(170deg, var(--bg1) 0%, var(--bg2) 100%); color: #fff;
  position: relative; flex: none; overflow: hidden;
  box-shadow: inset 0 0 0 1.5px var(--edge), 0 3px 8px rgba(0,0,0,.5);
  font-family: Georgia, 'Times New Roman', 'Noto Serif', serif; font-weight: 700; line-height: 1;
}
.card.sh { --bg1: #C8242C; --bg2: #8E0F16; --edge: #E0555B; }
.card.sd { --bg1: #2B62B8; --bg2: #173F85; --edge: #5487D6; }
.card.sc { --bg1: #24993A; --bg2: #146B24; --edge: #4CC260; }
.card.ss { --bg1: #2E2E2E; --bg2: #121212; --edge: #5A5A5A; }
.card .r { position: absolute; left: 9%; top: 5%; font-size: calc(var(--w) * .40); letter-spacing: -.04em; }
.card .s1 { position: absolute; left: 8%; top: 34%; font-size: calc(var(--w) * .38); font-family: 'Segoe UI Symbol', 'Noto Sans Symbols2', 'DejaVu Sans', sans-serif; }
.card .big { position: absolute; right: 7%; bottom: 3%; font-size: calc(var(--w) * .64); letter-spacing: -.07em; text-shadow: 0 1px 2px rgba(0,0,0,.25); }
.card.back {
  background:
    radial-gradient(circle at 50% 50%, rgba(255,215,114,.35) 0 18%, transparent 19%),
    repeating-linear-gradient(45deg, #B3121B 0 3px, #8E0D14 3px 6px);
  box-shadow: inset 0 0 0 2px #F2B33D, inset 0 0 0 4px #7A0A10, 0 3px 8px rgba(0,0,0,.45);
}
.card.dim { filter: brightness(.5) saturate(.6); }
.card.win { box-shadow: 0 0 0 2px var(--gold-hi), 0 0 16px rgba(255,215,114,.75); transform: translateY(-4px); }
.card.deal { animation: flipin .35s ease-out both; }
@keyframes flipin { from { transform: rotateY(90deg) translateY(-10px); opacity: .2; } }
.slot { width: 46px; height: 65px; border-radius: 6px; border: 1px dashed rgba(255,255,255,.12); }

/* Fichas */
.chip {
  --c: #212121; --s: #FFFFFF; --h: #4A4A4A;
  width: 22px; height: 22px; border-radius: 50%; position: absolute; left: 0;
  background: repeating-conic-gradient(var(--s) 0 14deg, var(--c) 14deg 45deg);
  box-shadow: 0 1.5px 0 rgba(0,0,0,.55), inset 0 0 0 1px rgba(0,0,0,.3);
}
.chip::after {
  content: ''; position: absolute; inset: 4px; border-radius: 50%;
  background: radial-gradient(circle at 38% 32%, var(--h), var(--c) 75%);
  box-shadow: 0 0 0 1px rgba(255,255,255,.55), inset 0 0 0 2px rgba(0,0,0,.15);
}
.stackc { position: relative; width: 22px; flex: none; }
.chips { display: flex; gap: 2px; align-items: flex-end; }

/* Lugares (estilo GG: cartas por cima do avatar, placa escura embaixo) */
.seat { position: absolute; transform: translate(-50%, -50%); width: 100px; display: grid; justify-items: center; z-index: 3; }
.seat.out .ava, .seat.out .plate, .seat.out .holes { opacity: .5; }
.seat .ava { z-index: 1; }
.seat .holes { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); display: flex; z-index: 2; }
.seat .holes .card { --w: 34px; }
.seat .holes .card:first-child { transform: rotate(-6deg); }
.seat .holes .card + .card { margin-left: -16px; transform: rotate(6deg); }
.plate {
  margin-top: -10px; z-index: 3; width: 100%; padding: 3px 6px 4px; border-radius: 6px; text-align: center; position: relative;
  background: linear-gradient(180deg, #2B2C30, #141518); border: 1px solid rgba(255,255,255,.12);
  box-shadow: 0 4px 10px rgba(0,0,0,.6);
}
.seat.turn .plate { border-color: #fff; box-shadow: 0 0 0 1px #fff, 0 0 14px rgba(255,255,255,.45); }
.plate .nm { display: block; font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #EDEDED; padding-bottom: 2px; border-bottom: 1px solid rgba(255,255,255,.08); }
.plate .stk { display: block; font: 700 15px/1.25 var(--display); color: #8CC8FF; letter-spacing: .02em; white-space: nowrap; }
.tbar { position: absolute; left: 4px; right: 4px; bottom: -7px; height: 4px; border-radius: 2px; background: rgba(0,0,0,.6); overflow: hidden; }
.tbar i { display: block; height: 100%; width: calc(var(--p, 1) * 100%); background: #4CD964; border-radius: 2px; }
.seat.urgent .tbar i { background: #FFA726; }
.seat.bank .tbar i { background: #FF3B30; }
.seat.win .plate { border-color: var(--gold-hi); box-shadow: 0 0 0 1px var(--gold-hi), 0 0 22px rgba(255,215,114,.6); }
.badge { position: absolute; top: calc(100% + 10px); left: 50%; transform: translateX(-50%); z-index: 4; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 4px; white-space: nowrap; background: #3A3F47; color: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.5); }
.b-check { background: #2E7D4F; } .b-call { background: #1F6FD1; } .b-raise { background: #E2661B; }
.b-allin { background: var(--fire); } .b-fold { background: #2A2B2E; color: #FF6B5E; box-shadow: inset 0 0 0 1.5px #D93025; } .b-win { background: linear-gradient(180deg, var(--gold-hi), var(--gold)); color: #2A1A00; }
.b-off { background: #4A4F57; } .b-hand { background: #F4F1EA; color: #15181D; }
.seat .shown { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); display: flex; gap: 2px; z-index: 4; }
.seat .shown .card { --w: 34px; }
.seat .bankt { position: absolute; top: -26px; font: 700 11px var(--body); color: #FF7B7B; white-space: nowrap; }
/* você: cartas grandes em cima da sua placa */
.seat.hero { width: 118px; }
.seat.hero .ava { display: none; }
.seat.hero .hero-cards { display: flex; margin-bottom: -6px; z-index: 2; }
.seat.hero .hero-cards .card { --w: 54px; }
.seat.hero .hero-cards .card:first-child { transform: rotate(-6deg) translateY(4px); }
.seat.hero .hero-cards .card + .card { margin-left: -14px; transform: rotate(6deg) translateY(4px); }
.seat.hero .hero-cards .card.win { box-shadow: 0 0 0 2px var(--gold-hi), 0 0 16px rgba(255,215,114,.75); }
.seat.hero .hero-cards.reveal .card { animation: myflip .45s ease-out both; }
.seat.hero .noava { display: block !important; }
.seat.hero .plate { margin-top: 0; }
.seat.hero .badge { top: calc(100% + 10px); }
.plate .bk { display: block; font-size: 10px; color: #9AA3AE; line-height: 1.1; }
@keyframes myflip { from { transform: rotateY(90deg) translateY(-20px); opacity: 0; } }
.dealer {
  position: absolute; z-index: 3; width: 22px; height: 22px; border-radius: 50%; transform: translate(-50%, -50%);
  background: radial-gradient(circle at 40% 35%, #FFE57F, #E0A800); color: #3A2A00; font: 800 13px/22px var(--display); text-align: center;
  box-shadow: 0 2px 4px rgba(0,0,0,.6), inset 0 0 0 2px #B88A00;
}
.bet { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 4px; z-index: 4; pointer-events: none; }
.bet .pill { font-size: 13px; padding: 1px 8px; background: rgba(8,28,18,.75); }
.bet.in { animation: betin .35s ease-out .25s both; }
@keyframes betin { from { opacity: 0; transform: translate(-50%, -50%) scale(.6); } }

#fx { position: absolute; inset: 0; pointer-events: none; z-index: 6; overflow: visible; }
.fly { position: absolute; left: 0; top: 0; will-change: transform; }
.bubble {
  position: absolute; transform: translate(-50%, -100%); z-index: 8; background: #fff; color: #15181D; border-radius: 14px;
  padding: 6px 10px; font-weight: 700; font-size: 14px; white-space: nowrap; box-shadow: 0 8px 20px rgba(0,0,0,.45);
  animation: bub 2.8s ease both;
}
.bubble.emoji { font-size: 30px; padding: 2px 8px; line-height: 1.2; }
.bubble::after { content: ''; position: absolute; left: 50%; bottom: -6px; margin-left: -6px; border: 6px solid transparent; border-bottom: 0; border-top-color: #fff; }

<script>
/* ==================================================================
   PokerTrama — mesa sem servidor.
   Quem cria a mesa vira o "dealer": o celular dele roda as regras
   (engine.js), embaralha e manda para cada amigo só as cartas dele.
   Os celulares se conectam direto (WebRTC) usando o PeerJS.
   ================================================================== */
(function () {
'use strict';
const E = window.PokerEngine;

/* ---------- Configuração ---------- */
const PEER_PREFIX = 'pokertramas-v1-';
const params = new URLSearchParams(location.search);
// Servidor que "apresenta" os celulares. Vazio = servidor público gratuito do PeerJS.
const PEER_SERVER = params.get('peerhost')
  ? { host: params.get('peerhost').split(':')[0], port: +params.get('peerhost').split(':')[1] || 9000, path: '/', secure: false }
  : {};
const PEER_OPTS = { ...PEER_SERVER, debug: 0 };
const PING_MS = 4000;
const DEAD_MS = 15000;
const EMOJIS = ['😂', '🔥', '😱', '😎', '👏', '🤡', '💸', '🙏'];
const PHRASES = ['Blefe!', 'Que sorte!', 'Bora!', 'Boa mão!', 'Pensa rápido!', 'All-in!', 'Tô fora', 'Desce mais!'];
const REACTIONS = new Set([...EMOJIS, ...PHRASES]);

/* ---------- Utilidades ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => Number(n || 0).toLocaleString('pt-BR');
function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} }
function lsJSON(k) { try { return JSON.parse(lsGet(k)); } catch { return null; } }
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

let toastTimer;
function toast(msg, ms = 2800) {
  const t = $('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, ms);
}

let myId = lsGet('pt.pid');
if (!myId) {
  const b = new Uint8Array(8); crypto.getRandomValues(b);
  myId = Array.from(b, (x) => x.toString(16).padStart(2, '0')).join('');
  lsSet('pt.pid', myId);
}
const normId = (s) => String(s || '').toLowerCase().replace(/[^a-z0-9-]/g, '');

/* ---------- Perfil (cor e foto) ---------- */
let myColor = lsGet('pt.color') || E.COLORS[Math.floor(Math.random() * E.COLORS.length)];
let myPhoto = lsGet('pt.photo') || '';

/* ---------- Estado da tela ---------- */
let mode = null;           // 'host' | 'client' | null
let state = null;
let myHand = null;
let avatars = {};          // uid -> foto (dataURL)
let tableId = '', tablePw = '';
let clockOffset = 0;
let unitBB = lsGet('pt.unit') === 'bb';
let raiseTo = 0, raiseOpen = false, raiseKey = '', lastTurnKey = '';
let pendingUntil = 0;
let pre = null;            // pré-ação { type, key, bet }
let prevSnap = null;       // estado anterior (para animar)
let summaryShownFor = '';

const now = () => Date.now() + (mode === 'client' ? clockOffset : 0);

/* ==================================================================
   SONS (sintetizados, sem arquivos)
   ================================================================== */
const Sfx = {
  ac: null, on: lsGet('pt.sound') !== 'off',
  unlock() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch {}
  },
  ok() { return this.on && this.ac && this.ac.state === 'running'; },
  tone(f, dur, o = {}) {
    if (!this.ok()) return;
    const t = this.ac.currentTime + (o.when || 0);
    const osc = this.ac.createOscillator(), g = this.ac.createGain();
    osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t);
    if (o.slideTo) osc.frequency.exponentialRampToValueAtTime(o.slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(o.gain || 0.1, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(this.ac.destination); osc.start(t); osc.stop(t + dur + 0.02);
  },
  noise(dur, o = {}) {
    if (!this.ok()) return;
    const t = this.ac.currentTime + (o.when || 0);
    const len = Math.max(1, Math.floor(this.ac.sampleRate * dur));
    const buf = this.ac.createBuffer(1, len, this.ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ac.createBufferSource(); src.buffer = buf;
    const f = this.ac.createBiquadFilter(); f.type = o.type || 'bandpass'; f.frequency.value = o.freq || 2000; f.Q.value = o.q || 1;
    const g = this.ac.createGain(); g.gain.value = o.gain || 0.2;
    src.connect(f); f.connect(g); g.connect(this.ac.destination); src.start(t);
  },
  shuffle() { for (let i = 0; i < 12; i++) this.noise(0.03, { freq: 2600 + Math.random() * 2400, q: 1.4, gain: 0.22, when: i * 0.04 }); },
  deal(when = 0) { this.noise(0.07, { type: 'highpass', freq: 3000, gain: 0.16, when }); },
  flip(when = 0) { this.noise(0.05, { freq: 1700, q: 0.9, gain: 0.3, when }); this.tone(700, 0.03, { gain: 0.04, when }); },
  chip(when = 0) {
    for (let k = 0; k < 3; k++) this.tone(3600 + Math.random() * 1200, 0.035, { type: 'triangle', gain: 0.06, when: when + k * 0.03 });
    this.noise(0.03, { freq: 6000, q: 2, gain: 0.12, when });
  },
  chips(when = 0) { for (let k = 0; k < 4; k++) this.chip(when + k * 0.06); },
  check(when = 0) { this.tone(160, 0.09, { gain: 0.35, when, slideTo: 80 }); this.tone(160, 0.09, { gain: 0.3, when: when + 0.12, slideTo: 80 }); },
  fold(when = 0) { this.noise(0.14, { type: 'lowpass', freq: 1400, gain: 0.18, when }); },
  turn() { this.tone(880, 0.14, { gain: 0.12 }); this.tone(1320, 0.22, { gain: 0.12, when: 0.13 }); },
  win() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.25, { type: 'triangle', gain: 0.13, when: i * 0.1 })); this.chips(0.2); },
  pop() { this.tone(520, 0.08, { slideTo: 900, gain: 0.08 }); },
};
document.addEventListener('pointerdown', () => Sfx.unlock(), { capture: true });

/* ==================================================================
   ANFITRIÃO (dealer)
   ================================================================== */
const Host = {
  peer: null, conns: new Map(), lastSeen: new Map(), spectators: new Map(), lastReact: new Map(),
  ctx: null, timer: null,

  open(id, pw, name, settings, restored) {
    return new Promise((resolve, reject) => {
      const peer = new Peer(PEER_PREFIX + id, PEER_OPTS);
      let opened = false;
      peer.on('open', () => {
        opened = true; this.peer = peer;
        if (restored) { state = restored.state; this.ctx = restored.ctx; }
        else {
          state = E.createRoomState(id.toUpperCase(), myId, name, settings, Date.now(), myColor);
          this.ctx = { deck: [], hands: {} };
        }
        avatars = {}; if (myPhoto) avatars[myId] = myPhoto;
        tableId = id; tablePw = pw; mode = 'host';
        clearInterval(this.timer);
        this.timer = setInterval(() => this.loop(), 400);
        this.changed();
        resolve();
      });
      peer.on('connection', (conn) => this.accept(conn));
      peer.on('disconnected', () => { if (!peer.destroyed) setTimeout(() => { try { peer.reconnect(); } catch {} }, 1500); });
      peer.on('error', (e) => {
        if (!opened) { peer.destroy(); reject(new Error(e.type === 'unavailable-id' ? 'id' : netErr(e))); }
        else if (e.type === 'network' || e.type === 'server-error') setBanner('Sem internet. Os jogadores podem cair.');
      });
    });
  },

  accept(conn) {
    let pid = null;
    conn.on('data', (msg) => {
      if (!msg || typeof msg !== 'object') return;
      if (!pid) {
        if (msg.t !== 'hello') return;
        if (String(msg.pw || '') !== tablePw) { conn.send({ t: 'err', fatal: true, msg: 'Senha errada' }); setTimeout(() => conn.close(), 400); return; }
        if (!msg.pid || msg.pid === myId) { conn.close(); return; }
        const p = String(msg.pid);
        try {
          E.addPlayer(state, p, msg.name, msg.color);
          this.spectators.delete(p);
        } catch (e) {
          if (e instanceof E.SpectatorError) this.spectators.set(p, { name: String(msg.name || '').slice(0, 16), color: msg.color });
          else { conn.send({ t: 'err', fatal: true, msg: e.message }); setTimeout(() => conn.close(), 400); return; }
        }
        pid = p;
        if (typeof msg.photo === 'string' && msg.photo.startsWith('data:image/') && msg.photo.length < 40000) avatars[pid] = msg.photo;
        else delete avatars[pid];
        const old = this.conns.get(pid);
        this.conns.set(pid, conn);
        if (old && old !== conn) { try { old.close(); } catch {} }
        this.lastSeen.set(pid, performance.now());
        this.broadcastAvatars();
        this.changed();
        return;
      }
      this.lastSeen.set(pid, performance.now());
      if (msg.t === 'op') {
        const err = this.run(pid, msg.op, msg);
        if (err) conn.send({ t: 'err', msg: err });
      }
    });
    conn.on('close', () => { if (pid && this.conns.get(pid) === conn) this.lost(pid); });
    conn.on('error', () => {});
  },

  lost(pid) {
    this.conns.delete(pid);
    const i = E.seatOf(state, pid);
    if (i >= 0 && !state.seats[i].sitOut) { E.setSitOut(state, pid, true); this.changed(); }
  },

  broadcastAvatars() {
    for (const c of this.conns.values()) { try { c.send({ t: 'avatars', map: avatars }); } catch {} }
  },

  react(pid, text) {
    const t = String(text || '');
    if (!REACTIONS.has(t)) return 'Reação inválida';
    const seat = E.seatOf(state, pid);
    if (seat < 0) return 'Só quem está na mesa pode reagir';
    const last = this.lastReact.get(pid) || 0;
    if (Date.now() - last < 1200) return null;
    this.lastReact.set(pid, Date.now());
    for (const c of this.conns.values()) { try { c.send({ t: 'react', seat, text: t }); } catch {} }
    showReaction(seat, t);
    return null;
  },

  run(pid, op, d = {}) {
    try {
      const isHost = pid === myId;
      switch (op) {
        case 'act':
          if (d.handNumber !== undefined && d.handNumber !== state.handNumber) throw new E.GameError('Essa mão já terminou');
          E.act(state, this.ctx, pid, String(d.action), d.amount, Date.now()); break;
        case 'start':
          if (!isHost) throw new E.GameError('Só o anfitrião pode começar');
          if (state.phase !== 'waiting') throw new E.GameError('O jogo já começou');
          this.ctx = E.startHand(state, Date.now()); break;
        case 'show': E.showCards(state, this.ctx, pid); break;
        case 'react': return this.react(pid, d.text);
        case 'rebuy': E.rebuy(state, pid); break;
        case 'reenter': E.reenter(state, pid, Date.now()); break;
        case 'noreenter': E.declineReentry(state, pid, Date.now()); break;
        case 'sitout': E.setSitOut(state, pid, !!d.value); break;
        case 'newtourney': {
          if (!isHost) throw new E.GameError('Só o anfitrião pode começar outro torneio');
          E.newTournament(state);
          for (const [p, info] of this.spectators) {
            if (!this.conns.has(p)) continue;
            try { E.addPlayer(state, p, info.name || 'Jogador', info.color); this.spectators.delete(p); } catch {}
          }
          break;
        }
        case 'leave': {
          E.removePlayer(state, this.ctx, pid);
          this.spectators.delete(pid);
          const c = this.conns.get(pid); this.conns.delete(pid);
          if (c) setTimeout(() => c.close(), 300);
          break;
        }
        case 'kick': {
          if (!isHost) throw new E.GameError('Só o anfitrião pode remover');
          const s = state.seats[+d.seat];
          if (!s || s.uid === myId) throw new E.GameError('Não dá para remover');
          E.removePlayer(state, this.ctx, s.uid, 'foi removido pelo anfitrião');
          const c = this.conns.get(s.uid); this.conns.delete(s.uid);
          if (c) { c.send({ t: 'closed', msg: 'Você foi removido da mesa' }); setTimeout(() => c.close(), 300); }
          break;
        }
        default: throw new E.GameError('Ação desconhecida');
      }
      this.changed();
      return null;
    } catch (e) {
      if (e instanceof E.GameError) return e.message;
      console.error(e); return 'Erro inesperado';
    }
  },

  loop() {
    const t = Date.now();
    const mono = performance.now();
    for (const [pid, seen] of this.lastSeen) {
      if (this.conns.has(pid) && mono - seen > DEAD_MS) { const c = this.conns.get(pid); this.lost(pid); try { c.close(); } catch {} }
    }
    const r = E.tick(state, this.ctx, t);
    if (r) { if (r.type === 'nexthand') this.ctx = r.ctx; this.changed(); }
    if (!this._lastPing || mono - this._lastPing > PING_MS) {
      this._lastPing = mono;
      for (const c of this.conns.values()) { try { c.send({ t: 'ping', now: t }); } catch {} }
    }
    updateTimers();
  },

  handFor(pid) {
    const cards = this.ctx && this.ctx.hands && this.ctx.hands[pid];
    return cards && state.handNumber > 0 ? { cards, handNumber: state.handNumber } : null;
  },

  changed() {
    state.updatedAt = Date.now();
    lsSet('pt.host', JSON.stringify({ id: tableId, pw: tablePw, state, ctx: this.ctx, at: Date.now() }));
    const t = Date.now();
    for (const [pid, c] of this.conns) {
      try { c.send({ t: 'state', state, hand: this.handFor(pid), now: t }); } catch {}
    }
    myHand = this.handFor(myId);
    render();
  },

  close() {
    clearInterval(this.timer);
    for (const c of this.conns.values()) { try { c.send({ t: 'closed', msg: 'O anfitrião encerrou a mesa', summary: true }); } catch {} }
    const p = this.peer;
    setTimeout(() => { try { p && p.destroy(); } catch {} }, 500);
    this.peer = null; this.conns.clear(); this.lastSeen.clear(); this.spectators.clear();
    lsSet('pt.host', null);
  },
};

/* ==================================================================
   JOGADOR (conecta no anfitrião)
   ================================================================== */
const Client = {
  peer: null, conn: null, joined: false, lastMsg: 0, retry: null, watchdog: null, name: '',

  ensurePeer() {
    return new Promise((resolve, reject) => {
      if (this.peer && !this.peer.destroyed && !this.peer.disconnected && this.peer.open) return resolve(this.peer);
      if (this.peer) { try { this.peer.destroy(); } catch {} }
      const p = new Peer(PEER_OPTS);
      this.peer = p;
      p.on('open', () => resolve(p));
      p.on('error', (e) => {
        if (e.type === 'peer-unavailable') this.onUnavailable();
        else if (!p.open) reject(new Error(netErr(e)));
      });
      p.on('disconnected', () => { if (!p.destroyed) setTimeout(() => { try { p.reconnect(); } catch {} }, 1500); });
    });
  },

  join(id, pw, name) {
    this.name = name; tableId = id; tablePw = pw;
    return new Promise(async (resolve, reject) => {
      this._first = { resolve, reject };
      const to = setTimeout(() => this.fail('A mesa não respondeu. Confira o ID e se o anfitrião está com o app aberto.'), 20000);
      this._first.clear = () => clearTimeout(to);
      try { await this.ensurePeer(); this.connect(); }
      catch (e) { this.fail(e.message); }
    });
  },

  fail(msg) {
    if (!this._first) return;
    const f = this._first; this._first = null; f.clear(); this.stop(); f.reject(new Error(msg));
  },

  onUnavailable() {
    if (this._first) this.fail('Mesa não encontrada. Confira o ID ou peça para quem criou abrir o app.');
    else setBanner('A mesa está fora do ar. Tentando reconectar…');
  },

  connect() {
    if (this.conn) { try { this.conn.close(); } catch {} }
    const c = this.peer.connect(PEER_PREFIX + tableId, { reliable: true, serialization: 'json' });
    this.conn = c;
    c.on('open', () => c.send({ t: 'hello', pid: myId, name: this.name, pw: tablePw, color: myColor, photo: myPhoto, v: 2 }));
    c.on('data', (m) => this.onMsg(m));
    c.on('close', () => { if (this.conn === c && mode === 'client') this.reconnectSoon(); });
    c.on('error', () => {});
  },

  onMsg(m) {
    if (!m || typeof m !== 'object') return;
    this.lastMsg = performance.now();
    if (m.now) {
      const off = m.now - Date.now();
      clockOffset = this.joined ? Math.round(clockOffset * 0.8 + off * 0.2) : off;
    }
    if (m.t === 'state') {
      state = m.state; myHand = m.hand;
      pendingUntil = 0;
      if (!this.joined) {
        this.joined = true; mode = 'client';
        const f = this._first; this._first = null; if (f) { f.clear(); f.resolve(); }
        this.startWatchdog();
      }
      setBanner('');
      render();
    } else if (m.t === 'avatars') {
      avatars = m.map || {}; render();
    } else if (m.t === 'react') {
      showReaction(m.seat, m.text);
    } else if (m.t === 'err') {
      if (m.fatal && this._first) this.fail(m.msg);
      else { pendingUntil = 0; toast(m.msg); render(); }
    } else if (m.t === 'closed') {
      toast(m.msg || 'Mesa encerrada', 4000);
      const last = state;
      leaveLocal();
      if (m.summary && last && last.handNumber > 0) openSummary(last, true);
    }
  },

  startWatchdog() {
    clearInterval(this.watchdog);
    this.watchdog = setInterval(() => {
      if (mode !== 'client') return;
      if (this.conn && this.conn.open) { try { this.conn.send({ t: 'ping' }); } catch {} }
      if (performance.now() - this.lastMsg > DEAD_MS) this.reconnectSoon();
    }, PING_MS);
  },

  reconnectSoon() {
    if (this.retry || mode !== 'client') return;
    setBanner('Conexão perdida. Reconectando…');
    this.retry = setTimeout(async () => {
      this.retry = null;
      if (mode !== 'client') return;
      try { await this.ensurePeer(); this.lastMsg = performance.now(); this.connect(); }
      catch { this.reconnectSoon(); return; }
      setTimeout(() => { if (mode === 'client' && performance.now() - this.lastMsg > 6000) this.reconnectSoon(); }, 7000);
    }, 2500);
  },

  send(op, data = {}) {
    if (!this.conn || !this.conn.open) { toast('Sem conexão com a mesa'); return; }
    this.conn.send({ t: 'op', op, ...data });
  },

  stop() {
    clearInterval(this.watchdog); clearTimeout(this.retry); this.retry = null;
    try { this.conn && this.conn.close(); } catch {}
    try { this.peer && this.peer.destroy(); } catch {}
    this.conn = null; this.peer = null; this.joined = false;
  },
};

function netErr(e) {
  if (e && ['network', 'server-error', 'socket-error', 'socket-closed'].includes(e.type)) return 'Sem conexão com a internet';
  if (e && e.type === 'browser-incompatible') return 'Este navegador não suporta o jogo';
  return 'Não foi possível conectar';
}

function send(op, data = {}) {
  if (mode === 'host') { const err = Host.run(myId, op, data); if (err) toast(err); }
  else if (mode === 'client') { if (op !== 'react') pendingUntil = Date.now() + 3000; Client.send(op, data); render(); }
}

/* ---------- Compartilhar (APK usa o plugin nativo) ---------- */
const NativeShare = window.Capacitor && window.Capacitor.registerPlugin ? window.Capacitor.registerPlugin('Share') : null;
async function shareText(text, title = 'PokerTrama') {
  if (NativeShare) { try { await NativeShare.share({ title, text, dialogTitle: 'Compartilhar' }); return; } catch (e) { if (String(e && e.message).includes('cancel')) return; } }
  if (navigator.share) { try { await navigator.share({ title, text }); return; } catch { return; } }
  try { await navigator.clipboard.writeText(text); toast('Copiado! Cole no WhatsApp.'); } catch { toast('Não foi possível compartilhar'); }
}

(function splash() {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let done = false;
  const go = () => {
    if (done) return; done = true;
    $('splash').classList.add('bye');
    setTimeout(() => { $('splash').hidden = true; }, 550);
  };
  const img = $('splash').querySelector('img');
  const start = () => setTimeout(go, reduce ? 1200 : 2400);
  if (img.complete) start(); else { img.addEventListener('load', start, { once: true }); img.addEventListener('error', go, { once: true }); setTimeout(start, 1500); }
  $('splash').addEventListener('click', go);
})();

/* ---------- Avatar ---------- */
function avaHTML(name, color, photo, cls = '') {
  return `<div class="ava ${cls}" style="--pc:${esc(color || '#555')}">${photo ? `<img src="${esc(photo)}" alt="">` : esc(String(name || '?').slice(0, 1).toUpperCase())}</div>`;
}
function renderMyAva() {
  $('myAva').outerHTML = avaHTML($('nameInput').value || '?', myColor, myPhoto, 'lg').replace('class="ava lg"', 'class="ava lg" id="myAva"');
  $('swatches').innerHTML = E.COLORS.map((c) => `<button class="sw" style="--c:${c}" data-c="${c}" aria-label="Cor" aria-pressed="${!myPhoto && c === myColor}"></button>`).join('')
    + `<button class="photo-btn" id="photoBtn">${myPhoto ? 'Trocar foto' : '📷 Foto'}</button>${myPhoto ? '<button class="photo-btn" id="noPhotoBtn">Remover foto</button>' : ''}`;
  document.querySelectorAll('.sw').forEach((b) => { b.onclick = () => { myColor = b.dataset.c; myPhoto = ''; lsSet('pt.color', myColor); lsSet('pt.photo', null); renderMyAva(); }; });
  $('photoBtn').onclick = () => $('photoInput').click();
  if ($('noPhotoBtn')) $('noPhotoBtn').onclick = () => { myPhoto = ''; lsSet('pt.photo', null); renderMyAva(); };
}
$('photoInput').onchange = async (e) => {
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const url = URL.createObjectURL(f);
    const img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = url; });
    const S = 112, cv = document.createElement('canvas'); cv.width = cv.height = S;
    const m = Math.min(img.width, img.height);
    cv.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, S, S);
    URL.revokeObjectURL(url);
    myPhoto = cv.toDataURL('image/jpeg', 0.8);
    lsSet('pt.photo', myPhoto); renderMyAva();
  } catch { toast('Não consegui abrir essa foto'); }
};
$('nameInput').addEventListener('input', () => { if (!myPhoto) $('myAva').textContent = ($('nameInput').value || '?').slice(0, 1).toUpperCase(); });

/* ---------- Lobby ---------- */
let createMode = 'torneio';
function setCreateMode(m) {
  createMode = m;
  $('modeT').setAttribute('aria-pressed', m === 'torneio'); $('modeC').setAttribute('aria-pressed', m === 'cash');
  $('levelField').hidden = m !== 'torneio'; $('reentryField').hidden = m !== 'torneio'; $('structHint').hidden = m !== 'torneio';
  $('rebuyField').hidden = m !== 'cash';
}
$('modeT').onclick = () => setCreateMode('torneio');
$('modeC').onclick = () => setCreateMode('cash');

function fillLobby() {
  $('nameInput').value = lsGet('pt.name') || '';
  const last = lsJSON('pt.last');
  const urlId = params.get('mesa');
  if (urlId) $('idInput').value = urlId.toUpperCase();
  else if (last) { $('idInput').value = last.id.toUpperCase(); $('pwInput').value = last.pw || ''; }
  const hs = lsJSON('pt.host');
  $('resumeBox').hidden = !hs;
  if (hs) $('resumeId').textContent = hs.id.toUpperCase();
  $('lobbyErr').textContent = '';
  renderMyAva();
}

function readLobby() {
  $('lobbyErr').textContent = ''; $('lobbyErr').style.color = '';
  const name = $('nameInput').value.trim();
  const id = normId($('idInput').value);
  const pw = $('pwInput').value;
  if (!name) { $('lobbyErr').textContent = 'Digite seu nome'; $('nameInput').focus(); return null; }
  if (id.length < 3) { $('lobbyErr').textContent = 'O ID da mesa precisa de pelo menos 3 letras ou números'; $('idInput').focus(); return null; }
  if (pw.length < 3) { $('lobbyErr').textContent = 'A senha precisa de pelo menos 3 caracteres'; $('pwInput').focus(); return null; }
  lsSet('pt.name', name);
  return { name, id, pw };
}
function lobbyBusy(on, label) {
  ['joinBtn', 'createBtn', 'resumeBtn'].forEach((b) => ($(b).disabled = on));
  if (label) { $('lobbyErr').style.color = 'var(--muted)'; $('lobbyErr').textContent = label; }
}

$('joinBtn').onclick = async () => {
  const f = readLobby(); if (!f) return;
  lobbyBusy(true, 'Conectando…');
  try {
    await Client.join(f.id, f.pw, f.name);
    lsSet('pt.last', JSON.stringify({ id: f.id, pw: f.pw }));
    enterGame();
  } catch (e) { $('lobbyErr').style.color = ''; $('lobbyErr').textContent = e.message; }
  finally { lobbyBusy(false); }
};

$('createBtn').onclick = async () => {
  const f = readLobby(); if (!f) return;
  if (lsGet('pt.host') && !confirm('Você tem uma mesa aberta salva. Criar outra descarta ela. Continuar?')) return;
  lobbyBusy(true, 'Abrindo a mesa…');
  const settings = {
    mode: createMode, startingStack: +$('setStack').value, smallBlind: +$('setSB').value, bigBlind: +$('setBB').value,
    levelMinutes: +$('setLevel').value, reentryLevels: +$('setReentry').value, allowRebuy: $('setRebuy').checked, turnSeconds: 30, timeBankSeconds: 60,
  };
  try {
    await Host.open(f.id, f.pw, f.name, settings, null);
    lsSet('pt.last', JSON.stringify({ id: f.id, pw: f.pw }));
    enterGame();
  } catch (e) {
    $('lobbyErr').style.color = '';
    $('lobbyErr').textContent = e.message === 'id' ? 'Já existe uma mesa aberta com esse ID. Escolha outro ou toque em "Entrar na mesa".' : e.message;
  } finally { lobbyBusy(false); }
};

$('resumeBtn').onclick = () => reopenHost();
$('discardBtn').onclick = () => {
  if (!confirm('Descartar a mesa salva? As fichas de todos serão perdidas.')) return;
  lsSet('pt.host', null); fillLobby();
};

async function reopenHost() {
  const hs = lsJSON('pt.host'); if (!hs) return;
  lobbyBusy(true);
  for (let attempt = 0; attempt < 25; attempt++) {
    lobbyBusy(true, attempt ? `Reabrindo a mesa… (tentativa ${attempt + 1})` : 'Reabrindo a mesa…');
    try {
      for (const s of hs.state.seats) if (s && s.uid !== myId) s.sitOut = true;
      await Host.open(hs.id, hs.pw, null, null, { state: hs.state, ctx: hs.ctx });
      lobbyBusy(false); $('lobbyErr').textContent = '';
      enterGame();
      return;
    } catch (e) {
      if (e.message !== 'id') { $('lobbyErr').style.color = ''; $('lobbyErr').textContent = e.message; lobbyBusy(false); return; }
      await sleep(3000);
    }
  }
  $('lobbyErr').style.color = '';
  $('lobbyErr').textContent = 'Não consegui reabrir: o ID ainda está ocupado. Tente de novo em 1 minuto.';
  lobbyBusy(false);
}

function enterGame() {
  $('idText').textContent = tableId.toUpperCase();
  raiseOpen = false; lastTurnKey = ''; pre = null; prevSnap = null; summaryShownFor = '';
  show('game');
  render();
}

function leaveLocal() {
  if (mode === 'host') Host.close();
  if (mode === 'client') Client.stop();
  mode = null; state = null; myHand = null; prevSnap = null;
  setBanner(''); closeSheet(); $('fx').innerHTML = '';
  fillLobby();
  show('lobby');
}
